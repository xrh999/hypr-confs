# https://sw.kovidgoyal.net/kitty/conf/
# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Obsidian
include current-theme.conf
# END_KITTY_THEME

# Font
font_family JetBrains Mono
font_size 12.0

# Transparency
background_opacity 0.75
background_blur 

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000
